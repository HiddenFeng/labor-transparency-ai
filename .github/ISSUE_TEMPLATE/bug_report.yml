name: Bug report (non-sensitive)
description: Report a reproducible product/engineering bug using synthetic or public-safe information only.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not submit secrets, private worker/case data, identity documents, real wage slips, private contacts, receipts/tokens or unredacted screenshots.**
        If the problem cannot be described safely with synthetic/minimized data, do not publish the sensitive details here. Read SECURITY.md and PRIVACY.md first.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Reference Instance
        - Independent/self-host instance
        - Public evidence / federation / mirror / peer
        - Documentation / governance
        - Build / CI / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible steps
      description: Use synthetic/public-safe inputs. State whether this is reference production, a local candidate, or a downstream instance.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / instance revision
      placeholder: v0.8.8-rc.1 / commit SHA / self-host release revision
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, private case text, personal identifiers, private contacts, tokens and sensitive attachments from this report.
          required: true
        - label: I am not using community popularity or emotion as evidence that a factual claim is true.
          required: true
