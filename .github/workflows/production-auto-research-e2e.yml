name: Manual production auto-research E2E
# v0.8.7-rc.1 post-deploy acceptance trigger: current production must satisfy this exact workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-auto-research-e2e.yml'

permissions:
  contents: read

concurrency:
  group: production-auto-research-e2e
  cancel-in-progress: false

jobs:
  production-auto-research-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create QA company and observe real Queue consumer research
        env:
          LTP_E2E_ORIGIN: https://workermanifestfellowship.dpdns.org
          LTP_E2E_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';

          const origin=process.env.LTP_E2E_ORIGIN.replace(/\/$/,'');
          const runId=process.env.LTP_E2E_RUN_ID;
          const runCode=Number(runId).toString(36);
          const region=`US · production-auto-research-e2e-${runCode}`;
          const companyName='Starbucks Corporation';

          const configResponse=await fetch(`${origin}/api/config`,{headers:{Origin:origin}});
          assert.equal(configResponse.status,200,'production config must be reachable');
          const config=await configResponse.json();
          assert.equal(config.mode,'CLOUDFLARE_WORKER_D1');
          assert.equal(config.version,'0.8.7-rc.1');
          assert.equal(config.capabilities?.automaticCompanyResearch,true);
          assert.equal(config.capabilities?.unattendedCompanyIntelligence,true);
          assert.equal(config.capabilities?.companyResearchQueue,true);
          assert.equal(config.capabilities?.scheduledCompanyResearch,true);
          assert.equal(config.capabilities?.officialReferences,true);
          assert.equal(config.capabilities?.officialRelations,true);
          const cookie=(configResponse.headers.get('set-cookie')||'').split(';')[0];
          assert.match(cookie,/^ltp_session=/);
          assert.match(config.csrfToken,/^[a-f0-9]{64}$/);

          const createResponse=await fetch(`${origin}/api/companies`,{
            method:'POST',
            headers:{Origin:origin,Accept:'application/json','Content-Type':'application/json','X-LTP-CSRF':config.csrfToken,Cookie:cookie},
            body:JSON.stringify({name:companyName,region,website:'https://www.starbucks.com/',consent:true})
          });
          const created=await createResponse.json();
          assert.equal(createResponse.status,200,JSON.stringify(created));
          assert.equal(created.duplicate,false,'QA region must create an isolated company');
          assert.equal(created.researchQueued,true);
          assert.equal(created.research?.status,'QUEUED');
          assert.equal(created.researchDispatch,'QUEUE_SENT');
          const companyId=created.company.id;
          console.log(`CREATED_COMPANY_ID=${companyId}`);
          console.log(`CREATED_COMPANY_REGION=${region}`);

          let company=null;
          for(let attempt=0;attempt<48;attempt++){
            const response=await fetch(`${origin}/api/companies`,{headers:{Origin:origin,Cookie:cookie,Accept:'application/json'}});
            assert.equal(response.status,200);
            const data=await response.json();
            company=data.items.find(x=>x.id===companyId)||null;
            assert.ok(company,'created company must remain publicly visible during QA');
            const status=company.research?.status||'MISSING';
            console.log(`poll=${attempt} research=${status} candidates=${company.research?.candidateCount||0} sourceErrors=${company.research?.sourceErrorCount||0}`);
            if(['AUTO_READY','AUTO_READY_WITH_SOURCE_GAPS'].includes(status))break;
            assert.ok(['QUEUED','COLLECTING'].includes(status),`unexpected lifecycle state ${status}`);
            await new Promise(resolve=>setTimeout(resolve,5000));
          }

          assert.ok(company?.research,'research projection must exist');
          assert.ok(['AUTO_READY','AUTO_READY_WITH_SOURCE_GAPS'].includes(company.research.status),'real Cloudflare Queue consumer must finish autonomous research within the acceptance window');
          assert.ok(company.research.candidateCount>0,'Starbucks should produce at least one bounded source candidate');
          assert.equal(company.research.reviewRequired,false,'normal production intelligence must not wait for a named reviewer');
          assert.ok(company.research.intelligence,'autonomous intelligence projection must exist');
          assert.ok(company.research.intelligence.coverage.machineVerifiedFacts>0,'Starbucks should produce at least one narrow machine-verified reference fact');
          assert.ok(company.research.intelligence.coverage.sourceSignals>0,'Starbucks should produce at least one bounded source signal');
          assert.ok(company.research.intelligence.coverage.publicEventCandidates>0,'Starbucks should produce at least one evidence-scoped public-record event candidate');
          assert.equal(company.research.intelligence.identity.status,'AUTO_BOUND_REFERENCE','Starbucks US QA must satisfy the strict GLEIF name+country rule');
          assert.equal(company.research.intelligence.policyVersion,'auto-intelligence-0.8.3');
          assert.equal(company.research.intelligence.dossier?.status,'REFERENCE_READY','machine-bound Starbucks should expose a ready dossier summary');
          assert.ok(Array.isArray(company.research.intelligence.timeline)&&company.research.intelligence.timeline.length>0,'public-safe event timeline must be present');
          assert.ok(Array.isArray(company.research.intelligence.clusters)&&company.research.intelligence.clusters.length>0,'autonomous candidate clusters must be public-safe and present');
          assert.ok(Array.isArray(company.research.providers)&&company.research.providers.length>=10);
          assert.ok(company.research.providers.some(x=>Array.isArray(x.previews)&&x.previews.length>0),'ordinary public projection must expose a safe candidate preview');
          assert.match(company.research.boundary,/候选/);

          const forbiddenKeys=new Set(['records','sampleRecord','case_number','reason_closed','raw','token']);
          function scan(value,path='root'){
            if(Array.isArray(value)){value.forEach((x,i)=>scan(x,`${path}[${i}]`));return;}
            if(!value||typeof value!=='object')return;
            for(const [key,val] of Object.entries(value)){
              assert.equal(forbiddenKeys.has(key),false,`forbidden public research key ${path}.${key}`);
              scan(val,`${path}.${key}`);
            }
          }
          scan(company.research);

          const healthResponse=await fetch(`${origin}/api/research/health`,{headers:{Origin:origin,Cookie:cookie,Accept:'application/json'}});
          assert.equal(healthResponse.status,200);const health=await healthResponse.json();
          assert.equal(health.unattendedOperation,true);assert.equal(health.runtime?.companyResearchQueue,true);assert.equal(health.selfHealing?.manualOperatorRequired,false);

          const ballotResponse=await fetch(`${origin}/api/companies/${companyId}/ballot`,{
            method:'POST',headers:{Origin:origin,Accept:'application/json','Content-Type':'application/json','X-LTP-CSRF':config.csrfToken,Cookie:cookie},body:JSON.stringify({direction:'negative'})
          });
          assert.equal(ballotResponse.status,200,'normal user interaction must remain functional after autonomous research');
          const afterBallotResponse=await fetch(`${origin}/api/companies`,{headers:{Origin:origin,Cookie:cookie,Accept:'application/json'}});assert.equal(afterBallotResponse.status,200);
          const afterBallot=(await afterBallotResponse.json()).items.find(x=>x.id===companyId);assert.equal(afterBallot.negative,1);assert.equal(afterBallot.participants,1);

          const detailResponse=await fetch(`${origin}/api/companies/${companyId}`,{headers:{Origin:origin,Cookie:cookie,Accept:'application/json'}});
          assert.equal(detailResponse.status,200,'public company dossier endpoint must be reachable');
          const detail=await detailResponse.json();
          assert.equal(detail.company?.id,companyId);assert.equal(detail.community?.negative,1);assert.equal(detail.community?.participants,1);
          assert.equal(detail.research?.intelligence?.dossier?.status,'REFERENCE_READY');
          assert.ok(detail.research?.intelligence?.timeline?.length>0,'company dossier must expose the safe event timeline');
          assert.ok(Array.isArray(detail.officialReferences),'company dossier must expose the official-reference lane even when empty');
          assert.ok(Array.isArray(detail.officialRelations),'company dossier must expose the official-relation lane even when empty');
          assert.ok(Array.isArray(detail.contributions?.products));assert.ok(Array.isArray(detail.contributions?.labourClaims));
          scan(detail);

          const result={
            status:'PASS_PRODUCTION_AUTONOMOUS_COMPANY_INTELLIGENCE_AND_INTERACTION',
            runId,
            origin,
            companyId,
            companyName,
            region,
            researchDispatch:created.researchDispatch,
            researchStatus:company.research.status,
            candidateCount:company.research.candidateCount,
            sourceSuccessCount:company.research.sourceSuccessCount,
            sourceErrorCount:company.research.sourceErrorCount,
            machineVerifiedFacts:company.research.intelligence.coverage.machineVerifiedFacts,
            sourceSignals:company.research.intelligence.coverage.sourceSignals,
            publicEventCandidates:company.research.intelligence.coverage.publicEventCandidates,
            dossierStatus:company.research.intelligence.dossier.status,
            identityStatus:company.research.intelligence.identity.status,
            clusterCount:company.research.intelligence.clusters.length,
            healthStatus:health.status,
            unattendedOperation:health.unattendedOperation,
            userInteraction:{negative:afterBallot.negative,participants:afterBallot.participants},
            publicDossierEndpoint:true,
            publicProviderCount:company.research.providers.length,
            hasSafePreview:company.research.providers.some(x=>x.previews?.length),
            cleanupRequired:true,
            evidenceBoundary:'The autonomous policy may machine-bind only narrow source-of-record reference facts under strict rules. Labor/legal/context material remains source signals or candidates and is not converted into broad company conclusions.'
          };
          await fs.writeFile('/tmp/production-auto-research-e2e.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: production-auto-research-e2e-${{ github.run_id }}
          path: /tmp/production-auto-research-e2e.json
          retention-days: 7

      - name: Cleanup boundary
        run: |
          echo 'This workflow intentionally has no Cloudflare credentials.'
          echo 'The project automation operator must delete only the QA company, companyResearch and QA ballot records from production D1 after capturing the artifact.'
