name: Public non-Tencent deployment smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: public-non-tencent-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify smoke contract locally
        run: node --test scripts/deployment/public_smoke.test.mjs

      - name: Verify public semantics, security headers, same-origin API and exact Origin policy
        run: node scripts/deployment/public_smoke.mjs

      - name: State deployment boundary
        run: |
          echo 'PASS means the non-Tencent global public path returned the expected product/API semantics from this GitHub-hosted runner.'
          echo 'It also verifies secure session headers and rejects unknown/retired EdgeOne origins.'
          echo 'It does not establish a Mainland-China SLA.'
